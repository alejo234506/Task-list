<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Tareas · Lista de tareas</title>
  <meta name="description" content="Lista de tareas con categorías, filtros, edición y guardado automático. HTML, CSS y JavaScript.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem('tareas-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main class="app">
    <header class="cabecera">
      <div>
        <h1>Mis Tareas</h1>
        <p class="resumen" id="resumen" aria-live="polite"></p>
      </div>
      <button type="button" id="tema" class="icono" aria-label="Cambiar a modo oscuro">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="anillo-wrap" aria-hidden="true">
      <div class="anillo" id="anillo"><span id="porcentaje">0%</span></div>
    </div>

    <form id="formulario" class="formulario" autocomplete="off">
      <label for="texto" class="sr">Nueva tarea</label>
      <input type="text" id="texto" placeholder="¿Qué tienes que hacer?" maxlength="120">
      <label for="categoria" class="sr">Categoría</label>
      <select id="categoria"></select>
      <button type="submit" class="btn-crear">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Crear
      </button>
      <p id="error" class="error" role="alert"></p>
    </form>

    <div class="barra">
      <div class="filtros" role="group" aria-label="Filtrar tareas">
        <button type="button" class="filtro" data-filtro="todas" aria-pressed="true">Todas</button>
        <button type="button" class="filtro" data-filtro="pendientes" aria-pressed="false">Pendientes</button>
        <button type="button" class="filtro" data-filtro="completadas" aria-pressed="false">Completadas</button>
      </div>
      <button type="button" id="limpiar" class="enlace">Borrar completadas</button>
    </div>

    <ul id="lista" class="lista"></ul>
    <p id="vacio" class="vacio" hidden></p>

    <p class="ayuda">Doble clic en una tarea para editarla · Enter para guardar · Esc para cancelar</p>
  </main>

  <footer class="pie">
    Basado en el proyecto original de <a href="https://github.com/JulianGabo06/Task-list">JulianGabo06</a> ·
    mejorado por <a href="https://github.com/alejo234506">ALEJO-SQ</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
